table inet nat {
	# NAT44 and NAT66
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oifname "CloudflareWARP" masquerade
	}

	# MSS clamp
	chain forward {
		type filter hook forward priority filter; policy accept;
		# MASQUE Tunnel MTU 1304
		iifname "CloudflareWARP" oifname "eth0" meta nfproto ipv6 tcp flags syn tcp option maxseg size set 1244
		iifname "CloudflareWARP" oifname "eth0" meta nfproto ipv4 tcp flags syn tcp option maxseg size set 1264
		# WireGuard Tunnel MTU 1340
		#iifname "CloudflareWARP" oifname "eth0" meta nfproto ipv6 tcp flags syn tcp option maxseg size set 1280
		#iifname "CloudflareWARP" oifname "eth0" meta nfproto ipv4 tcp flags syn tcp option maxseg size set 1300
	}

	chain output {
		type filter hook output priority mangle; policy accept;
		ip6 daddr fe00::/7 ip6 dscp set 0x2d # nd, mldv2, dhcpv6
	}
}
